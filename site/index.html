<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Valley — Painel EMS OCR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <aside class="nav">
      <div class="nav__brand">
        <span class="nav__eyebrow">Centro Médico Sul Valley</span>
        <h1 class="nav__title">Painel EMS OCR</h1>
      </div>

      <nav class="nav__list" id="nav-list">
        <!-- itens montados via JS a partir de GET /routes -->
      </nav>

      <div class="nav__future">
        <span class="nav__future-label">Em breve</span>
        <p class="nav__future-item">Comparar com toggle do Discord</p>
        <p class="nav__future-item">Histórico de chamadas EMS</p>
      </div>

      <div class="nav__footer">
        <label class="nav__api-label" for="api-base">URL da API</label>
        <input class="nav__api-input" id="api-base" type="text" value="https://ems-ocr-api-59sa.onrender.com" spellcheck="false">
      </div>
    </aside>

    <main class="panel" id="panel">
      <p class="panel__empty">Carregando rotas da API...</p>
    </main>

  </div>

  <script>
    const apiBaseInput = document.getElementById("api-base");
    const navList = document.getElementById("nav-list");
    const panel = document.getElementById("panel");

    let rotas = [];
    let rotaAtivaId = null;

    function apiBase() {
      return apiBaseInput.value.replace(/\/$/, "");
    }

    async function carregarRotas() {
      try {
        const res = await fetch(`${apiBase()}/routes`);
        const data = await res.json();
        rotas = data.rotas || [];
        montarNav();
        if (rotas.length) selecionarRota(rotas[0].id);
      } catch (err) {
        navList.innerHTML = `<p class="nav__error">Não foi possível carregar as rotas. <br>A API está no ar em ${apiBase()}?</p>`;
        panel.innerHTML = `<p class="panel__empty">Sem conexão com a API.</p>`;
      }
    }

    function montarNav() {
      navList.innerHTML = "";
      rotas.forEach((rota) => {
        const btn = document.createElement("button");
        btn.className = "nav__item";
        btn.dataset.id = rota.id;
        btn.innerHTML = `
          <span class="nav__item-method">${rota.method}</span>
          <span class="nav__item-nome">${rota.nome}</span>
        `;
        btn.addEventListener("click", () => selecionarRota(rota.id));
        navList.appendChild(btn);
      });
    }

    function selecionarRota(id) {
      rotaAtivaId = id;
      document.querySelectorAll(".nav__item").forEach((el) => {
        el.classList.toggle("is-active", el.dataset.id === id);
      });
      renderPainel(rotas.find((r) => r.id === id));
    }

    function renderPainel(rota) {
      if (!rota) {
        panel.innerHTML = `<p class="panel__empty">Selecione uma rota.</p>`;
        return;
      }

      panel.innerHTML = `
        <header class="panel__header">
          <div class="panel__title-row">
            <span class="panel__method">${rota.method}</span>
            <code class="panel__path">${rota.path}</code>
          </div>
          <h2 class="panel__nome">${rota.nome}</h2>
          <p class="panel__descricao">${rota.descricao}</p>
        </header>
        <section class="panel__body" id="panel-body"></section>
        <section class="panel__result" id="panel-result" hidden></section>
      `;

      const body = document.getElementById("panel-body");

      if (rota.tipo === "status" || rota.tipo === "acao_simples") {
        body.innerHTML = `<button class="btn btn--primary" id="btn-executar">Testar</button>`;
        document.getElementById("btn-executar").addEventListener("click", () => executarSimples(rota));
      } else if (rota.tipo === "upload_imagem") {
        body.innerHTML = `
          <div class="dropzone" id="dropzone">
            <input type="file" id="file-input" accept="image/*" hidden>
            <p class="dropzone__text">Arraste o print aqui ou <span class="dropzone__link">escolha um arquivo</span></p>
            <p class="dropzone__hint">PNG ou JPG do painel de notificação in-game</p>
          </div>
          <div class="preview" id="preview" hidden>
            <img id="preview-img" alt="Pré-visualização do print enviado">
          </div>
        `;
        montarDropzone(rota);
      } else {
        body.innerHTML = `<p class="panel__empty">Tipo de ação desconhecido: ${rota.tipo}</p>`;
      }
    }

    // --- ação simples (status / sem parâmetros) ---
    async function executarSimples(rota) {
      setResultado("Executando...", false);
      try {
        const res = await fetch(`${apiBase()}${rota.path}`, { method: rota.method });
        const data = await res.json();
        setResultadoJson(data, !res.ok);
      } catch (err) {
        setResultado(`Não foi possível chamar ${rota.path}.`, true);
      }
    }

    // --- upload de imagem (ex: OCR do EMS) ---
    function montarDropzone(rota) {
      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("file-input");
      const preview = document.getElementById("preview");
      const previewImg = document.getElementById("preview-img");

      dropzone.addEventListener("click", () => fileInput.click());
      dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("is-active"); });
      dropzone.addEventListener("dragleave", () => dropzone.classList.remove("is-active"));
      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("is-active");
        if (e.dataTransfer.files[0]) tratarArquivo(e.dataTransfer.files[0], rota, preview, previewImg);
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files[0]) tratarArquivo(fileInput.files[0], rota, preview, previewImg);
      });
    }

    async function tratarArquivo(file, rota, preview, previewImg) {
      previewImg.src = URL.createObjectURL(file);
      preview.hidden = false;
      setResultado("Processando print...", false);

      const form = new FormData();
      form.append("file", file);

      try {
        const res = await fetch(`${apiBase()}${rota.path}`, { method: rota.method, body: form });
        const data = await res.json();
        if (!res.ok) {
          setResultado(data.detail || data.erro || "Erro ao processar a imagem.", true);
          return;
        }
        renderHud(data);
      } catch (err) {
        setResultado("Não foi possível falar com a API. Ela está no ar?", true);
      }
    }

    // --- painel de resultado no estilo do HUD "Atenção" do jogo, pra listas de médicos ---
    function renderHud(data) {
      const result = document.getElementById("panel-result");
      const linhas = (data.medicos || [])
        .map((m) => {
          if (m.suspeito) {
            return `<li class="hud__item--suspeito">
              <span class="hud__id hud__id--suspeito">${m.id}:</span> ${m.nome}
              <span class="hud__suspeito-tag" title="${m.motivo_suspeita || ""}">⚠ confira</span>
            </li>`;
          }
          return `<li><span class="hud__id">${m.id}:</span> ${m.nome}</li>`;
        })
        .join("");

      const resumoSuspeitos = data.total_suspeitos
        ? `<p class="hud__suspeito-resumo">⚠ ${data.total_suspeitos} entrada(s) suspeita(s) — ID fora do padrão esperado, confira antes de validar.</p>`
        : "";

      result.innerHTML = `
        <div class="hud">
          <div class="hud__bar"></div>
          <div class="hud__body">
            <div class="hud__title-row">
              <span class="hud__title">Atenção</span>
              <span class="hud__info" aria-hidden="true">ⓘ</span>
            </div>
            <p class="hud__summary">Atualmente ${data.total_detectado} Médicos no jogo.</p>
            <ol class="hud__list">${linhas}</ol>
            ${resumoSuspeitos}
            ${data.aviso ? `<p class="hud__warning">${data.aviso}</p>` : ""}
          </div>
        </div>
      `;
      result.hidden = false;
    }

    // --- resultado genérico em JSON, pra qualquer ação futura sem UI dedicada ---
    function setResultadoJson(data, isError) {
      const result = document.getElementById("panel-result");
      result.innerHTML = `<pre class="json-view ${isError ? "json-view--error" : ""}">${JSON.stringify(data, null, 2)}</pre>`;
      result.hidden = false;
    }

    function setResultado(msg, isError) {
      const result = document.getElementById("panel-result");
      result.innerHTML = `<p class="panel__status ${isError ? "panel__status--error" : ""}">${msg}</p>`;
      result.hidden = false;
    }

    apiBaseInput.addEventListener("change", carregarRotas);
    carregarRotas();
  </script>
</body>
</html>
